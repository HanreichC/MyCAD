# MyCAD im Dev-Container bauen und testen; ein AppImage-Release nur, wenn eins gewollt ist:
#   Push auf main   → bauen + testen (rot fällt früh auf), kein Release. Nur Doku geändert (docs/, *.md): gar nichts.
#                     Ein neuerer Push bricht den laufenden Test-Lauf ab: nur der neueste Stand zählt.
#   Tag v1.2.0      → bauen + testen + Release 1.2.0
#   Run workflow    → bauen + testen + Release 1.0.N (Knopf in GitHub › Actions)
#   jede Nacht      → wie Run workflow, aber nur, wenn main seit dem letzten Release neu ist
# Version 1.0.N: N = Anzahl Commits seit dem Commit, der diese Datei eingeführt hat (dieser selbst = 1.0.0); daher den
# Dateinamen nicht ändern.
name: Build, Test, Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']  # gilt nicht für Tags
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # 2 Uhr UTC (3 bzw. 4 Uhr in Deutschland)

permissions:
  contents: write

# Pushes auf main teilen sich eine Gruppe und lösen einander ab; Releases laufen nacheinander und werden nie abgebrochen
concurrency:
  group: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && 'ci' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Nachts nur bauen, wenn main seit dem letzten Release neu ist (kostet sonst 1,5 h für nichts)
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
            if [ -n "$last" ] && [ "$(gh release view "$last" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA" ]; then
              build=false
              echo "main ist seit $last unverändert: kein nächtlicher Build"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  appimage:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      RELEASE: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ganze Historie, sonst lassen sich die Commits nicht zählen
          submodules: true  # src/3rdParty/OndselSolver (Gelenk-Solver)

      - name: Version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            first=$(git log --diff-filter=A --format=%H -- .github/workflows/release.yml | tail -1)
            echo "version=1.0.$(( $(git rev-list --count HEAD) - $(git rev-list --count "$first") ))" >> "$GITHUB_OUTPUT"
          fi

      - name: Platz schaffen
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Compiler-Cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # Das Image ist auf ein Datum gepinnt (Dockerfile), also aus dem Cache nehmen: neu gebaut wird nur, wenn sich das
      # Dockerfile ändert. Vorher lud jeder Lauf alle Arch-Pakete vom langsamen Archiv-Server und baute OCCT, Coin und
      # Pivy neu; ein Hänger dort machte den ganzen Lauf rot
      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Container bauen
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          tags: mycad-dev
          load: true
          cache-from: type=gha,scope=mycad-dev
          cache-to: type=gha,scope=mycad-dev,mode=max

      - name: MyCAD bauen
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e CCACHE_DIR=/workspace/.ccache \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            mycad-dev sh -c "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMYCAD_RELEASE=${{ steps.version.outputs.version }} -Wno-dev && cmake --build build -j$(nproc)"

      - name: Tests (rot = kein Release)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace -e JOBS=$(nproc) \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            mycad-dev tests/run_all.sh

      - name: Testergebnisse
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results

      - name: AppImage packen
        if: env.RELEASE == 'true'
        run: docker run --rm -v "$PWD:/workspace" -w /workspace mycad-dev tools/appimage.sh "${{ steps.version.outputs.version }}"

      - name: Release veröffentlichen
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # GitHub antwortet gelegentlich mit HTTP 500, daher bis zu 3 Versuche statt den ganzen Build zu verwerfen
          for i in 1 2 3; do
            gh release create "v$v" "MyCAD-$v-x86_64.AppImage" --target "$GITHUB_SHA" --title "MyCAD $v" --generate-notes && exit 0
            sleep 30
          done
          exit 1
