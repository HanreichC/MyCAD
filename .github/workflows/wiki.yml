# docs/wiki ist die Quelle des GitHub-Wikis (eigenes Repo MyCAD.wiki.git): bei jedem Push nach main, der dort etwas
# ändert, wird das Wiki zur genauen Kopie (Seiten, die es in docs/wiki nicht mehr gibt, verschwinden auch dort).
name: Wiki

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch:

permissions:
  contents: write  # reicht auch fürs Wiki-Repo desselben Projekts

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs/wiki ins GitHub-Wiki übernehmen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Wiki ist schon aktuell"; exit 0; fi
          git commit -m "Aus docs/wiki übernommen (${GITHUB_SHA::7})"
          git push
